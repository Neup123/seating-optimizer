openapi: 3.1.0
info:
  title: Seating Plan Optimizer API
  version: 0.1.0
  description: Headless seating optimization with Phase 2 venue layouts, floor maps and table cards. All rules and geometry are supplied as data.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: health
      summary: Health status
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}
  /v1/import:
    post:
      operationId: importRegistrations
      summary: Import CSV or XLSX registrations
      description: Source-column-to-target mapping overrides configurable header detection. Rows with errors are reported, not silently discarded.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportRequest'}
      responses:
        '200':
          description: Imported guests and row diagnostics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportResult'}
        '400':
          description: Invalid base64 input
  /v1/layouts/import:
    post:
      operationId: importVenueLayout
      summary: Import structured venue JSON and/or numbered SVG floor drafts
      description: "An annotated SVG draft uses an svg root with data-zone-id and viewBox, with one g data-table-id containing a rect, ellipse or circle for each table. Files can be combined into one multi-floor layout. No OCR or image guessing."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LayoutImportRequest'}
      responses:
        '200':
          description: Validated, portable floor-by-floor venue layout
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VenueLayout'}
        '400':
          description: Invalid base64 input
        '422':
          description: Invalid layout geometry or references
  /v1/solve:
    post:
      operationId: solveSession
      summary: Solve a single session using CP-SAT
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Problem'}
      responses:
        '200':
          description: Plan or honest infeasible/unknown report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '422':
          description: Invalid problem or references
  /v1/exports/table:
    post:
      operationId: exportTable
      summary: Render the complete table-by-table list
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: Plain-text seating table list
          content:
            text/plain:
              schema: {type: string}
  /v1/exports/json:
    post:
      operationId: exportJson
      summary: Render the complete machine-readable plan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: Full plan including assignments, reasons and compromises
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
  /v1/exports/floor-map/svg:
    post:
      operationId: exportFloorMapSvg
      summary: Render an SVG page per floor with group labels on tables
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: Ordered floor pages containing independently printable SVG
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SvgFloorBundle'}
        '422':
          description: Nonfeasible plan or incomplete/mismatched layout
  /v1/exports/floor-map/pdf:
    post:
      operationId: exportFloorMapPdf
      summary: Print a vector PDF containing one page for every floor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: Vector PDF, one page per floor
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '422':
          description: Nonfeasible plan or incomplete/mismatched layout
  /v1/exports/table-cards/pdf:
    post:
      operationId: exportTableCardsPdf
      summary: Print one A5 card per table with assigned families
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: Printable PDF, one page per table including empty tables
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '422':
          description: Nonfeasible or invalid plan
  /openapi.yaml:
    get:
      operationId: openapiYaml
      summary: Download the static OpenAPI document
      responses:
        '200':
          description: OpenAPI YAML
          content:
            text/plain:
              schema: {type: string}
components:
  schemas:
    Zone:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    Table:
      type: object
      additionalProperties: false
      required: [id, zone_id, capacity]
      properties:
        id: {type: string}
        zone_id: {type: string}
        capacity: {type: integer, minimum: 1}
    TableDrawing:
      type: object
      additionalProperties: false
      required: [table_id, x, y, width, height]
      properties:
        table_id: {type: string}
        x: {type: number, minimum: 0}
        y: {type: number, minimum: 0}
        width: {type: number, exclusiveMinimum: 0}
        height: {type: number, exclusiveMinimum: 0}
        shape: {type: string, enum: [rectangle, ellipse, circle], default: rectangle}
    FloorLayout:
      type: object
      additionalProperties: false
      required: [zone_id, width, height]
      properties:
        zone_id: {type: string}
        width: {type: number, exclusiveMinimum: 0, maximum: 10000}
        height: {type: number, exclusiveMinimum: 0, maximum: 10000}
        tables:
          type: array
          items: {$ref: '#/components/schemas/TableDrawing'}
    VenueLayout:
      type: object
      additionalProperties: false
      required: [floors]
      properties:
        floors:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/FloorLayout'}
    LayoutFile:
      type: object
      required: [filename, content_base64]
      properties:
        filename: {type: string}
        content_base64: {type: string, contentEncoding: base64}
    LayoutImportRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/LayoutFile'}
        zones:
          anyOf:
            - type: array
              items: {$ref: '#/components/schemas/Zone'}
            - type: 'null'
        tables:
          anyOf:
            - type: array
              items: {$ref: '#/components/schemas/Table'}
            - type: 'null'
    SvgFloorPage:
      type: object
      additionalProperties: false
      required: [zone_id, svg]
      properties:
        zone_id: {type: string}
        svg: {type: string}
    SvgFloorBundle:
      type: object
      additionalProperties: false
      required: [pages]
      properties:
        pages:
          type: array
          items: {$ref: '#/components/schemas/SvgFloorPage'}
    Guest:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        group_id: {type: [string, 'null']}
        attributes:
          type: object
          additionalProperties: {type: [string, number, boolean]}
    Rule:
      type: object
      additionalProperties: false
      required: [id, shape, mode]
      properties:
        id: {type: string}
        shape:
          type: string
          enum: [attribute_grouping, zone_restriction, pair, capacity, fill_efficiency, pin]
        mode: {type: string, enum: [soft, hard]}
        parameters: {type: object, additionalProperties: true}
        weight: {type: [integer, 'null'], minimum: 1}
    SolverConfig:
      type: object
      additionalProperties: false
      properties:
        time_limit_seconds: {type: number, exclusiveMinimum: 0, default: 5}
        workers: {type: integer, minimum: 1, maximum: 64, default: 8}
        random_seed: {type: integer, default: 42}
    Problem:
      type: object
      additionalProperties: false
      required: [session_id, zones, tables, guests]
      properties:
        session_id: {type: string}
        zones: {type: array, items: {$ref: '#/components/schemas/Zone'}}
        tables: {type: array, items: {$ref: '#/components/schemas/Table'}}
        guests: {type: array, items: {$ref: '#/components/schemas/Guest'}}
        rules: {type: array, items: {$ref: '#/components/schemas/Rule'}}
        config: {$ref: '#/components/schemas/SolverConfig'}
        layout:
          anyOf:
            - {$ref: '#/components/schemas/VenueLayout'}
            - {type: 'null'}
    ImportRequest:
      type: object
      required: [filename, content_base64]
      properties:
        filename: {type: string}
        content_base64: {type: string, contentEncoding: base64}
        mapping: {type: [object, 'null'], additionalProperties: {type: string}}
        header_aliases:
          type: [object, 'null']
          additionalProperties:
            type: array
            items: {type: string}
    ImportIssue:
      type: object
      required: [row, column, severity, message]
      properties:
        row: {type: [integer, 'null']}
        column: {type: [string, 'null']}
        severity: {type: string, enum: [error, warning]}
        message: {type: string}
    ImportResult:
      type: object
      required: [guests, mapping, issues, rows_seen, rows_imported]
      properties:
        guests: {type: array, items: {$ref: '#/components/schemas/Guest'}}
        mapping: {type: object, additionalProperties: {type: string}}
        issues: {type: array, items: {$ref: '#/components/schemas/ImportIssue'}}
        rows_seen: {type: integer}
        rows_imported: {type: integer}
    Reason:
      type: object
      required: [rule_id, description, points]
      properties:
        rule_id: {type: string}
        description: {type: string}
        points: {type: number}
    Assignment:
      type: object
      required: [group_id, table_id, guest_ids, guest_names, reasons, points]
      properties:
        group_id: {type: string}
        table_id: {type: string}
        guest_ids: {type: array, items: {type: string}}
        guest_names: {type: array, items: {type: string}}
        reasons: {type: array, items: {$ref: '#/components/schemas/Reason'}}
        points: {type: number}
    ScoreItem:
      type: object
      required: [rule_id, points]
      properties:
        rule_id: {type: string}
        points: {type: integer}
    Compromise:
      type: object
      required: [rule_id, description, lost_points]
      properties:
        rule_id: {type: string}
        description: {type: string}
        lost_points: {type: integer}
    TableUsage:
      type: object
      required: [table_id, zone_id, capacity, occupied, empty_seats]
      properties:
        table_id: {type: string}
        zone_id: {type: string}
        capacity: {type: integer}
        occupied: {type: integer}
        empty_seats: {type: integer}
    Plan:
      type: object
      additionalProperties: false
      required: [session_id, status, total_score, assignments, tables, score_breakdown, compromises, conflicting_constraints, solve_seconds, message]
      properties:
        session_id: {type: string}
        status: {type: string, enum: [optimal, feasible, infeasible, unknown]}
        total_score: {type: [integer, 'null']}
        assignments: {type: array, items: {$ref: '#/components/schemas/Assignment'}}
        tables: {type: array, items: {$ref: '#/components/schemas/TableUsage'}}
        score_breakdown: {type: array, items: {$ref: '#/components/schemas/ScoreItem'}}
        compromises: {type: array, items: {$ref: '#/components/schemas/Compromise'}}
        conflicting_constraints: {type: array, items: {type: string}}
        solve_seconds: {type: number}
        message: {type: string}
        layout:
          anyOf:
            - {$ref: '#/components/schemas/VenueLayout'}
            - {type: 'null'}
