openapi: 3.1.0
info:
  title: Seating Plan Optimizer API
  version: 0.1.0
  description: Headless seating optimization with venue layouts, printable exports, data-driven rule catalog and spreadsheet previews. The visual client only consumes these documented API capabilities.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: health
      summary: Health status
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}
  /v1/import:
    post:
      operationId: importRegistrations
      summary: Import CSV or XLSX registrations
      description: Source-column-to-target mapping overrides configurable header detection. Rows with errors are reported, not silently discarded.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportRequest'}
      responses:
        '200':
          description: Imported guests and row diagnostics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportResult'}
        '400':
          description: Invalid base64 input
  /v1/import/preview:
    post:
      operationId: previewRegistrations
      summary: Preview spreadsheet headers and automatic/manual mapping
      description: Returns detected column mappings, sample rows and diagnostics without committing an import. Manual mapping remains available through /v1/import.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportRequest'}
      responses:
        '200':
          description: Headers, column mapping, sample rows and validation errors
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportPreview'}
        '400':
          description: Invalid base64 input
  /v1/rules/catalog:
    get:
      operationId: listRuleShapes
      summary: Retrieve the six available data-driven rule shapes
      responses:
        '200':
          description: Shape/parameter fields, supported modes, titles and default weights
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleCatalog'}
  /v1/layouts/import:
    post:
      operationId: importVenueLayout
      summary: Import structured venue JSON and/or numbered SVG floor drafts
      description: "An annotated SVG draft uses an svg root with data-zone-id and viewBox, with one g data-table-id containing a rect, ellipse or circle for each table. Files can be combined into one multi-floor layout. No OCR or image guessing."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LayoutImportRequest'}
      responses:
        '200':
          description: Validated, portable floor-by-floor venue layout
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VenueLayout'}
        '400':
          description: Invalid base64 input
        '422':
          description: Invalid layout geometry or references
  /v1/configurations/validate:
    post:
      operationId: validateVenueConfiguration
      summary: Validate a portable named venue, capacities and rules without guests
      description: Stateless validation; callers can store, export, duplicate or load the returned JSON independently of guest import.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VenueConfiguration'}
      responses:
        '200':
          description: Validated, portable guest-free configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VenueConfiguration'}
        '422':
          description: Invalid capacities, rule parameters, geometry or references
  /v1/solve:
    post:
      operationId: solveSession
      summary: Solve a single session using CP-SAT
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Problem'}
      responses:
        '200':
          description: Plan or honest infeasible/unknown report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '422':
          description: Invalid problem or references
  /v1/reassign/options:
    post:
      operationId: proposeReassignment
      summary: Solver-check concrete moves for a party and its stored human instruction
      description: All options satisfy hard constraints and physical chair capacities. Finite-weight scoring losses and affected parties are returned for confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReassignRequest'}
      responses:
        '200':
          description: Concrete options, their full proposed plans and rule blockers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReassignResponse'}
        '422':
          description: Invalid party, place, instruction or stale plan
  /v1/exports/table:
    post:
      operationId: exportTable
      summary: Render the complete table-by-table list
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: Plain-text seating table list
          content:
            text/plain:
              schema: {type: string}
  /v1/exports/json:
    post:
      operationId: exportJson
      summary: Render the complete machine-readable plan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: Full plan including assignments, reasons and compromises
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
  /v1/exports/people-list/html:
    post:
      operationId: exportPeopleListHtml
      summary: Print or download a people list (combined or per floor / room)
      description: Exact guest IDs, names, group and table assignments from the supplied solved Plan. No seat numbers are invented. HTML is printable to paper or PDF. Reasons are omitted by default.
      parameters:
        - in: query
          name: group_by
          schema: {type: string, enum: [combined, floor], default: combined}
        - in: query
          name: include_reasons
          schema: {type: boolean, default: false}
        - in: query
          name: fields
          description: Repeat for each imported guest attribute column to display; omitted by default.
          schema: {type: array, items: {type: string}}
          style: form
          explode: true
        - in: query
          name: field_labels
          description: Optional source-column titles in the same order as fields; display-only, leaving field keys and values unchanged.
          schema: {type: array, items: {type: string}}
          style: form
          explode: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: Portable printable HTML (one combined table or a table per floor)
          content:
            text/html:
              schema: {type: string}
        '422':
          description: Nonfeasible plan or contradictory assignment data
  /v1/exports/table-list/html:
    post:
      operationId: exportTableListHtml
      summary: Print or download a table-to-groups list (combined or per table)
      description: Exact assigned groups and guest identities from the supplied solved Plan. Includes empty tables. Reasons are omitted by default.
      parameters:
        - in: query
          name: group_by
          schema: {type: string, enum: [combined, table], default: combined}
        - in: query
          name: include_reasons
          schema: {type: boolean, default: false}
        - in: query
          name: fields
          description: Repeat for each imported guest attribute column to display; omitted by default.
          schema: {type: array, items: {type: string}}
          style: form
          explode: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: Portable printable HTML (one combined table or a table per physical table)
          content:
            text/html:
              schema: {type: string}
        '422':
          description: Nonfeasible plan or contradictory assignment data
  /v1/exports/floor-map/svg:
    post:
      operationId: exportFloorMapSvg
      summary: Render an SVG page per floor with group labels on tables
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: Ordered floor pages containing independently printable SVG
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SvgFloorBundle'}
        '422':
          description: Nonfeasible plan or incomplete/mismatched layout
  /v1/exports/floor-map/pdf:
    post:
      operationId: exportFloorMapPdf
      summary: Print a vector PDF containing one page for every floor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: Vector PDF, one page per floor
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '422':
          description: Nonfeasible plan or incomplete/mismatched layout
  /v1/exports/table-cards/pdf:
    post:
      operationId: exportTableCardsPdf
      summary: Print cards in a one-per-page A5 layout or an A4 2/4-card cutting grid
      parameters:
        - name: cards_per_page
          in: query
          required: false
          description: Number of complete table cards to print on a physical page.
          schema: {type: integer, enum: [1, 2, 4], default: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Plan'}
      responses:
        '200':
          description: Printable PDF including empty tables; one card per A5 by default, or 2/4 on each A4 sheet
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '422':
          description: Nonfeasible or invalid plan
  /openapi.yaml:
    get:
      operationId: openapiYaml
      summary: Download the static OpenAPI document
      responses:
        '200':
          description: OpenAPI YAML
          content:
            text/plain:
              schema: {type: string}
components:
  schemas:
    Zone:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    Table:
      type: object
      additionalProperties: false
      required: [id, zone_id, capacity]
      properties:
        id: {type: string}
        zone_id: {type: string}
        capacity: {type: integer, minimum: 1}
        small_group_priority:
          type: boolean
          default: false
          description: Soft preference for groups of one or two (one score point per assigned small group).
        properties:
          type: array
          description: Passive table tags; ignored unless a guest-need rule refers to one.
          default: []
          uniqueItems: true
          items: {type: string, minLength: 1}
    TableDrawing:
      type: object
      additionalProperties: false
      required: [table_id, x, y, width, height]
      properties:
        table_id: {type: string}
        x: {type: number, minimum: 0}
        y: {type: number, minimum: 0}
        width: {type: number, exclusiveMinimum: 0}
        height: {type: number, exclusiveMinimum: 0}
        shape: {type: string, enum: [rectangle, ellipse, circle], default: rectangle}
        small_group_priority:
          type: boolean
          default: false
          description: Portable layout metadata; copied to Table.small_group_priority when importing a layout.
        properties:
          type: array
          description: Portable copy of table tags stored in layout JSON; the solver reads Table.properties.
          default: []
          uniqueItems: true
          items: {type: string, minLength: 1}
    FloorLayout:
      type: object
      additionalProperties: false
      required: [zone_id, width, height]
      properties:
        zone_id: {type: string}
        width: {type: number, exclusiveMinimum: 0, maximum: 10000}
        height: {type: number, exclusiveMinimum: 0, maximum: 10000}
        tables:
          type: array
          items: {$ref: '#/components/schemas/TableDrawing'}
    VenueLayout:
      type: object
      additionalProperties: false
      required: [floors]
      properties:
        floors:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/FloorLayout'}
    LayoutFile:
      type: object
      required: [filename, content_base64]
      properties:
        filename: {type: string}
        content_base64: {type: string, contentEncoding: base64}
    LayoutImportRequest:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/LayoutFile'}
        zones:
          anyOf:
            - type: array
              items: {$ref: '#/components/schemas/Zone'}
            - type: 'null'
        tables:
          anyOf:
            - type: array
              items: {$ref: '#/components/schemas/Table'}
            - type: 'null'
    SvgFloorPage:
      type: object
      additionalProperties: false
      required: [zone_id, svg]
      properties:
        zone_id: {type: string}
        svg: {type: string}
    SvgFloorBundle:
      type: object
      additionalProperties: false
      required: [pages]
      properties:
        pages:
          type: array
          items: {$ref: '#/components/schemas/SvgFloorPage'}
    ImportPreview:
      type: object
      additionalProperties: false
      required: [headers, detected_mapping, mapping, targets, sample_rows, issues, rows_seen]
      properties:
        headers: {type: array, items: {type: string}}
        detected_mapping: {type: object, additionalProperties: {type: string}}
        mapping: {type: object, additionalProperties: {type: string}}
        targets: {type: array, items: {type: string}}
        sample_rows:
          type: array
          items: {type: object, additionalProperties: {type: string}}
        issues: {type: array, items: {$ref: '#/components/schemas/ImportIssue'}}
        rows_seen: {type: integer, minimum: 0}
    RuleField:
      type: object
      additionalProperties: false
      required: [name, label, kind, required, choices]
      properties:
        name: {type: string}
        label: {type: string}
        kind: {type: string, enum: [text, zone, table, target, select, pattern, tiers]}
        required: {type: boolean}
        choices: {type: array, items: {type: string}}
    RuleShapeSpec:
      type: object
      additionalProperties: false
      required: [shape, title, description, modes, default_mode, default_weight, fields]
      properties:
        shape: {type: string, enum: [attribute_grouping, zone_restriction, table_property_need, pair, capacity, fill_efficiency, pin, global_pattern, tiered_placement]}
        title: {type: string}
        description: {type: string}
        modes: {type: array, items: {type: string, enum: [soft, hard, staged]}}
        default_mode: {type: string, enum: [soft, hard, staged]}
        default_weight: {type: [integer, 'null']}
        fields: {type: array, items: {$ref: '#/components/schemas/RuleField'}}
    RuleCatalog:
      type: object
      additionalProperties: false
      required: [shapes]
      properties:
        shapes: {type: array, items: {$ref: '#/components/schemas/RuleShapeSpec'}}
    VenueConfiguration:
      type: object
      additionalProperties: false
      required: [version, name, zones, tables, layout, rules]
      properties:
        version: {type: integer, const: 1}
        name: {type: string, minLength: 1}
        zones: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Zone'}}
        tables: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Table'}}
        layout: {$ref: '#/components/schemas/VenueLayout'}
        rules: {type: array, items: {$ref: '#/components/schemas/Rule'}}
    Guest:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        group_id: {type: [string, 'null']}
        group_name: {type: [string, 'null'], description: Human-readable registration or party name.}
        attributes:
          type: object
          additionalProperties: {type: [string, number, boolean]}
    Rule:
      type: object
      additionalProperties: false
      required: [id, shape, mode]
      properties:
        id: {type: string}
        shape:
          type: string
          enum: [attribute_grouping, zone_restriction, table_property_need, pair, capacity, fill_efficiency, pin, global_pattern]
        mode: {type: string, enum: [soft, hard, staged]}
        parameters:
          type: object
          additionalProperties: true
          description: For tiered_placement, an object with target (guest/group ID) and tiers, ordered from best to worst. Each tier has a zones array and/or a tables array. These are unions of locations, not weights; unlisted tables are a final fallback.
        weight: {type: [integer, 'null'], minimum: 1, description: null for hard and staged rules}
    ManualInstruction:
      type: object
      additionalProperties: false
      required: [id, group_id, action, place_type, place_id]
      properties:
        id: {type: string, minLength: 1}
        group_id: {type: string, minLength: 1}
        action: {type: string, enum: [not_here, move_to]}
        place_type: {type: string, enum: [table, floor, zone]}
        place_id: {type: string, minLength: 1}
        allow_split: {type: boolean, default: false}
    SolverConfig:
      type: object
      additionalProperties: false
      properties:
        time_limit_seconds: {type: number, exclusiveMinimum: 0, default: 5}
        workers: {type: integer, minimum: 1, maximum: 64, default: 8}
        random_seed: {type: integer, default: 42}
    Problem:
      type: object
      additionalProperties: false
      required: [session_id, zones, tables, guests]
      properties:
        session_id: {type: string}
        zones: {type: array, items: {$ref: '#/components/schemas/Zone'}}
        tables: {type: array, items: {$ref: '#/components/schemas/Table'}}
        guests: {type: array, items: {$ref: '#/components/schemas/Guest'}}
        rules: {type: array, items: {$ref: '#/components/schemas/Rule'}}
        manual_instructions: {type: array, items: {$ref: '#/components/schemas/ManualInstruction'}}
        locked_guest_tables: {type: object, additionalProperties: {type: string}}
        splittable_groups: {type: array, items: {type: string}}
        config: {$ref: '#/components/schemas/SolverConfig'}
        layout:
          anyOf:
            - {$ref: '#/components/schemas/VenueLayout'}
            - {type: 'null'}
    ImportRequest:
      type: object
      required: [filename, content_base64]
      properties:
        filename: {type: string}
        content_base64: {type: string, contentEncoding: base64}
        mapping: {type: [object, 'null'], additionalProperties: {type: string}}
        header_aliases:
          type: [object, 'null']
          additionalProperties:
            type: array
            items: {type: string}
    ImportIssue:
      type: object
      required: [row, column, severity, message]
      properties:
        row: {type: [integer, 'null']}
        column: {type: [string, 'null']}
        severity: {type: string, enum: [error, warning]}
        message: {type: string}
    ImportResult:
      type: object
      required: [guests, mapping, issues, rows_seen, rows_imported]
      properties:
        guests: {type: array, items: {$ref: '#/components/schemas/Guest'}}
        mapping: {type: object, additionalProperties: {type: string}}
        issues: {type: array, items: {$ref: '#/components/schemas/ImportIssue'}}
        rows_seen: {type: integer}
        rows_imported: {type: integer}
    Reason:
      type: object
      required: [rule_id, description, points]
      properties:
        rule_id: {type: string}
        description: {type: string}
        points: {type: number}
    Assignment:
      type: object
      required: [group_id, table_id, guest_ids, guest_names, reasons, points]
      properties:
        group_id: {type: string}
        group_name: {type: [string, 'null'], description: Human-facing party label, independent of the internal group ID.}
        table_id: {type: string}
        guest_ids: {type: array, items: {type: string}}
        guest_names: {type: array, items: {type: string}}
        guest_attributes:
          description: Imported attributes aligned with guest_ids and guest_names.
          type: array
          items:
            type: object
            additionalProperties: {type: [string, integer, number, boolean]}
        reasons: {type: array, items: {$ref: '#/components/schemas/Reason'}}
        points: {type: number}
    ScoreItem:
      type: object
      required: [rule_id, points]
      properties:
        rule_id: {type: string}
        points: {type: integer}
    PatternMatch:
      type: object
      additionalProperties: false
      required: [rule_id, table_id, description, points]
      properties:
        rule_id: {type: string}
        table_id: {type: string}
        description: {type: string}
        points: {type: integer}
    Compromise:
      type: object
      required: [rule_id, description, lost_points]
      properties:
        rule_id: {type: string}
        description: {type: string}
        lost_points: {type: integer}
    TableUsage:
      type: object
      required: [table_id, zone_id, capacity, occupied, empty_seats]
      properties:
        table_id: {type: string}
        zone_id: {type: string}
        capacity: {type: integer}
        occupied: {type: integer}
        empty_seats: {type: integer}
    Plan:
      type: object
      additionalProperties: false
      required: [session_id, status, total_score, assignments, tables, score_breakdown, compromises, conflicting_constraints, solve_seconds, message]
      properties:
        session_id: {type: string}
        status: {type: string, enum: [optimal, feasible, infeasible, unknown]}
        manual_instructions: {type: array, items: {$ref: '#/components/schemas/ManualInstruction'}}
        total_score: {type: [integer, 'null']}
        assignments: {type: array, items: {$ref: '#/components/schemas/Assignment'}}
        tables: {type: array, items: {$ref: '#/components/schemas/TableUsage'}}
        score_breakdown: {type: array, items: {$ref: '#/components/schemas/ScoreItem'}}
        pattern_matches:
          type: array
          description: Per-table matches (including empty tables) of enabled global pattern rules.
          items: {$ref: '#/components/schemas/PatternMatch'}
        compromises: {type: array, items: {$ref: '#/components/schemas/Compromise'}}
        conflicting_constraints: {type: array, items: {type: string}}
        solve_seconds: {type: number}
        message: {type: string}
        layout:
          anyOf:
            - {$ref: '#/components/schemas/VenueLayout'}
            - {type: 'null'}

    ReassignRequest:
      type: object
      additionalProperties: false
      required: [problem, plan, instruction]
      properties:
        problem: {$ref: '#/components/schemas/Problem'}
        plan: {$ref: '#/components/schemas/Plan'}
        instruction: {$ref: '#/components/schemas/ManualInstruction'}
    Movement:
      type: object
      additionalProperties: false
      required: [group_id, party_name, before, after, people]
      properties:
        group_id: {type: string}
        party_name: {type: string}
        before: {type: array, items: {type: string}}
        after: {type: array, items: {type: string}}
        people: {type: integer}
    ReassignOption:
      type: object
      additionalProperties: false
      required: [id, kind, title, movements, score_delta, soft_rule_warnings, plan]
      properties:
        id: {type: string}
        kind: {type: string, enum: [free-space, one-to-one, many-for-one, reverse-many-for-one, split, chain, re-optimize]}
        title: {type: string}
        movements: {type: array, items: {$ref: '#/components/schemas/Movement'}}
        score_delta: {type: integer}
        soft_rule_warnings: {type: array, items: {type: string}}
        plan: {$ref: '#/components/schemas/Plan'}
    ReassignResponse:
      type: object
      additionalProperties: false
      required: [status, options, blockers]
      properties:
        status: {type: string, enum: [available, blocked, unknown]}
        options: {type: array, items: {$ref: '#/components/schemas/ReassignOption'}}
        blockers: {type: array, items: {type: string}}
