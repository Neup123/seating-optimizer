[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seating-optimizer"
version = "0.1.0"
description = "Headless, explainable CP-SAT seating optimizer for event meal sessions"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Neup123"}]
dependencies = [
  "ortools>=9.10,<10",
  "pydantic>=2.8,<3",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "PyYAML>=6,<7", "jsonschema>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seating_optimizer = ["header_aliases.json"]
"seating_optimizer.api" = ["openapi.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
