name: Seating core API and browser tests
on:
  push:
    branches: [main, feature/phase-1-headless-optimizer, feat/67-rule-instance-fields, feat/65-overflow-page, feat/71-tiered-placement, feat/70-zone-companionship, feat/generic-engines-phase1]
  pull_request:
    branches: [main, feat/53-interactive-views, feat/64-low-priority]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Run unit, API contract and golden tests
        run: python -m pytest -v -s

  visual-client:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Run DOM tests for all four UI screens
        run: npm run test:ui
      - name: Install Chromium for true end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Run 120-guest browser golden test against live FastAPI
        run: npm run test:browser

