name: Capture verified README screenshots
on:
  push:
    branches: [docs/97-ui-screenshots]
permissions:
  contents: write
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend and screenshot tools
        run: python -m pip install -e ".[api,test]" Pillow
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live browser golden test with synthetic event data
        run: npm run test:browser
      - name: Extract checked screenshots from completed browser test
        run: python scripts/capture_readme_screenshots.py
      - name: Commit generated assets on the screenshot PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "docs: add verified Playwright UI screenshots (#97)"
            git push origin HEAD:docs/97-ui-screenshots
          fi
